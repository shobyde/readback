[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readback"
version = "0.1.0"
description = "Self-hosted reading comprehension and points tracking for families"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sho Byde", email = "shobyde@gmail.com" }]
keywords = ["reading", "quiz", "homeschool", "sqlite", "flask"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Education",
]
dependencies = [
  "Flask>=3.0,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
readback = "readback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"readback.web" = ["templates/*.html", "static/*.css", "static/*.svg", "static/fonts/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
